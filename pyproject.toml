[project]
name = "midas"
version = "0.1.0"
description = "台股盤後投研桌面應用"
requires-python = "==3.12.*"
dependencies = [
    "customtkinter>=5.2.2",
    "FinMind>=0.3.8",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "google-generativeai>=0.8.0",
    "platformdirs>=4.2.0",
    "google-genai>=2.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
